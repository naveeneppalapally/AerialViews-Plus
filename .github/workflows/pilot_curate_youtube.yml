name: Pilot YouTube ML Curation

on:
  workflow_dispatch:
    inputs:
      categories:
        description: 'Categories to curate'
        required: false
        default: 'drone nature ocean cities animals'
      candidates_per_cat:
        description: 'Candidates per category'
        required: false
        default: '8'

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run ML Curation Pilot
        run: |
          python3 scripts/curate_youtube_ml.py \
            --categories ${{ inputs.categories || 'drone nature ocean cities animals' }} \
            --candidates-per-cat ${{ inputs.candidates_per_cat || '8' }} \
            --output-dir curation_output

      - name: Upload Curated Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curated-youtube-pilot
          path: curation_output/
          retention-days: 7
