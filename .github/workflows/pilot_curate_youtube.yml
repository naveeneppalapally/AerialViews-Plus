name: Pilot YouTube ML Curation

on:
  workflow_dispatch:
    inputs:
      categories:
        description: 'Categories to curate'
        required: false
        default: 'drone nature ocean cities animals'
      candidates_per_cat:
        description: 'Candidates per category'
        required: false
        default: '10'

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PyTorch and OpenCLIP
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install open_clip_torch pillow

      - name: Run ML Curation Pilot
        run: |
          python3 scripts/curate_youtube_ml.py \
            --categories ${{ inputs.categories || 'drone nature ocean cities animals' }} \
            --candidates-per-cat ${{ inputs.candidates_per_cat || '10' }} \
            --output-dir curation_output

      - name: Upload Curated Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: curated-youtube-pilot
          path: curation_output/
          retention-days: 7
