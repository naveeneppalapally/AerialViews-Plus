name: Pilot YouTube ML Curation

on:
  workflow_dispatch:
    inputs:
      categories:
        description: 'Categories to curate (space/comma separated)'
        required: false
        default: 'drone nature ocean cities animals space weather winter'
      candidates_per_cat:
        description: 'Candidates per category'
        required: false
        default: '20'
      waste_threshold:
        description: 'Waste threshold percentage (lower = stricter, default 45.0)'
        required: false
        default: '45.0'

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run ML Curation Benchmark
        run: |
          python3 scripts/curate_youtube_ml.py \
            --categories ${{ inputs.categories || 'drone nature ocean cities animals space weather winter' }} \
            --candidates-per-cat ${{ inputs.candidates_per_cat || '20' }} \
            --waste-threshold ${{ inputs.waste_threshold || '45.0' }} \
            --output-dir curation_output

      - name: Publish Step Summary
        if: always()
        run: |
          if [ -f curation_output/github_step_summary.md ]; then
            cat curation_output/github_step_summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Curated Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curated-youtube-benchmark
          path: curation_output/
          retention-days: 14
